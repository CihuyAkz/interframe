# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false

# NeoForge / Minecraft (matches the dreamsfactory pack, same as Foveate)
minecraft_version=1.21.1
neoforge_version=21.1.219

# Sodium build used in the pack (we compile against its config API, like Foveate does)
sodium_version=mc1.21.1-0.8.12-beta.2-neoforge

# Optional neural backend. ONNX Runtime is NOT bundled (the GPU natives are huge); it is loaded
# reflectively at runtime if the user drops it on the classpath. We only compile against it.
onnxruntime_version=1.18.0

# Mod properties
mod_version=1.2.0
maven_group=dev.fallingcloud
archives_base_name=interframe
